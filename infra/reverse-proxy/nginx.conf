# ============================================================================
#  Nginx reverse proxy for the dashboard (alternative to Caddy).
#
#     sudo cp nginx.conf /etc/nginx/sites-available/dashboard
#     sudo ln -s /etc/nginx/sites-available/dashboard /etc/nginx/sites-enabled/
#     sudo certbot --nginx -d dashboard.example.com    # provisions TLS certs
#     sudo nginx -t && sudo systemctl reload nginx
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name dashboard.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dashboard.example.com;

    # Certbot fills these in (or point at your own certs).
    ssl_certificate     /etc/letsencrypt/live/dashboard.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3000;   # app binds localhost only
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
